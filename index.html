<!-- CONTACT LTR + Bilingual - يبدأ من اليسار -->
<section id="contact" dir="ltr" style="background:#0f0f0f;padding:70px 20px;text-align:left">
<div style="max-width:1100px;margin:auto">

  <!-- زر اللغة - العميل يختار -->
  <div style="text-align:right">
    <button onclick="setLang('en')" style="background:#ff6a00;color:#fff;padding:6px 14px;border:none;border-radius:6px">EN</button>
    <button onclick="setLang('ar')" style="background:#222;color:#fff;padding:6px 14px;border:none;border-radius:6px;margin-left:6px">AR</button>
  </div>

  <h2 id="t-title" style="text-align:center;color:#ff6a00;font-size:2.2rem;margin:20px 0">Contact Us - Built in Omdurman for GCC</h2>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">

    <div style="background:#151515;border-radius:14px;padding:22px">
      <h3 id="t-wa" style="color:#fff">Direct WhatsApp</h3>
      <a href="https://wa.me/249922562846" style="display:block;margin-top:12px;background:#25D366;color:#fff;padding:12px;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold">Open WhatsApp</a>
      <p style="color:#777;margin-top:8px;font-size:12px">+249 922562846</p>
    </div>

    <div style="background:#151515;border-radius:14px;padding:22px;color:#ccc">
      <h3 style="color:#ff6a00">Services</h3>
      <p style="margin-top:10px">info@ats-eng.com<br>Cummins / CAT / Perkins<br>Deep Sea - ATS Panels<br>Kide / Porkka Cold Rooms</p>
    </div>

    <div style="background:#fff;border-radius:14px;padding:22px">
      <input id="ph-name" placeholder="Factory Name" style="width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:6px">
      <input id="ph-phone" placeholder="WhatsApp" style="width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:6px">
      <button id="t-send" style="width:100%;background:#ff6a00;color:#fff;padding:12px;border:none;border-radius:6px;margin-top:8px;font-weight:bold">Send Now</button>
    </div>

  </div>
</div>
</section>

<script>
const dict = {
  en: { title:"Contact Us - Built in Omdurman for GCC", wa:"Direct WhatsApp", name:"Factory Name", phone:"WhatsApp", send:"Send Now" },
  ar: { title:"تواصل معنا - صُنع في أم درمان للخليج", wa:"واتساب مباشر", name:"اسم المصنع", phone:"رقم الواتساب", send:"إرسال الآن" }
};
function setLang(l){
  document.getElementById('t-title').textContent = dict[l].title;
  document.getElementById('t-wa').textContent = dict[l].wa;
  document.getElementById('ph-name').placeholder = dict[l].name;
  document.getElementById('ph-phone').placeholder = dict[l].phone;
  document.getElementById('t-send').textContent = dict[l].send;
  document.getElementById('contact').dir = l==='ar' ? 'rtl' : 'ltr';
  document.getElementById('contact').style.textAlign = l==='ar' ? 'right' : 'left';
  localStorage.setItem('ats-lang', l);
}
setLang(localStorage.getItem('ats-lang')||'en');
</script>
